# The nginx of the web panel.
#
# It serves the built panel and passes everything under /api to the API
# container. The address of the API is looked up again and again, so the
# panel keeps working when the API container gets a new address.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # the DNS of docker
    resolver 127.0.0.11 valid=10s ipv6=off;

    # the API of the panel
    location /api/ {
        set $api api:3000;
        proxy_pass http://$api$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 120s;
    }

    # the panel is a single page - unknown addresses show index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # the files of the build may be cached, index.html may not
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # a little more safety
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    client_max_body_size 10m;
}
